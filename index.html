<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogos CT Titã - Filtro Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { 
            width: 100%; height: 100%; 
            background: #000; color: #fff; 
            font-family: 'Teko', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; 
        }

        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 860px;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        video, canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* FUMAÇA ANIMADA NAS LATERAIS */
        .smoke-left {
            position: absolute;
            top: 0; left: -25%;
            width: 65%; height: 100%;
            background: radial-gradient(circle at 10% 50%, rgba(220, 38, 38, 0.65), transparent 75%);
            filter: blur(25px);
            pointer-events: none;
            z-index: 2;
            animation: pulseL 3.5s ease-in-out infinite alternate;
        }

        .smoke-right {
            position: absolute;
            top: 0; right: -25%;
            width: 65%; height: 100%;
            background: radial-gradient(circle at 90% 50%, rgba(37, 99, 235, 0.65), transparent 75%);
            filter: blur(25px);
            pointer-events: none;
            z-index: 2;
            animation: pulseR 3.5s ease-in-out infinite alternate;
        }

        @keyframes pulseL { 0% { opacity: 0.5; } 100% { opacity: 0.9; } }
        @keyframes pulseR { 0% { opacity: 0.9; } 100% { opacity: 0.5; } }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 35px 15px 105px 15px;
        }

        /* FRASE NO TOPO */
        .badge-card {
            width: 92%;
            max-width: 380px;
            background: rgba(8, 8, 14, 0.85);
            border: 2px solid;
            border-image: linear-gradient(90deg, #dc2626, #2563eb) 1;
            padding: 4px 10px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .badge-text {
            font-size: clamp(20px, 5.2vw, 30px);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff4d4d 0%, #ffffff 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        /* LOGO CT TITÃ 3D NO RODAPÉ */
        .logo-box {
            width: 88%;
            max-width: 330px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-3d {
            width: 100%;
            max-width: 300px;
            height: auto;
            filter: saturate(1.35) contrast(1.2)
                    drop-shadow(0px 10px 22px rgba(0, 0, 0, 0.98))
                    drop-shadow(-5px 0px 18px rgba(239, 68, 68, 1))
                    drop-shadow(5px 0px 18px rgba(59, 130, 246, 1));
            transform: perspective(600px) rotateX(4deg);
            animation: logo3dPulse 2.8s ease-in-out infinite alternate;
        }

        @keyframes logo3dPulse {
            0% { transform: perspective(600px) rotateX(4deg) scale(1); }
            100% { transform: perspective(600px) rotateX(4deg) scale(1.05); }
        }

        .logo-text-fallback {
            background: linear-gradient(90deg, #ef4444 20%, #ffffff 50%, #3b82f6 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 5px;
            text-shadow: 0 0 25px rgba(239, 68, 68, 0.9), 0 0 25px rgba(59, 130, 246, 0.9);
        }

        /* EFEITOS DE INTERAÇÃO */
        #flashEffect {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
        }

        #countdownOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        #countdownNumber {
            font-size: 120px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px #dc2626, 0 0 60px #2563eb;
        }

        #toastMsg {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(-25px);
            background: rgba(15, 15, 25, 0.92);
            color: #fff;
            padding: 12px 20px;
            border-radius: 20px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.85);
            z-index: 30;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.25);
            text-align: center;
        }

        #toastMsg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .btn-share-native {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.6);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ----------------------------------------------------
           BARRA DE CONTROLE TÉCNICA E PROFISSIONAL (DOCK FLUTUANTE)
           ---------------------------------------------------- */
        .controls-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 82%;
            max-width: 330px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 18px;
            background: rgba(12, 12, 18, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 35px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
            z-index: 10;
            pointer-events: auto;
        }

        /* BOTÕES SECUNDÁRIOS REFINADOS (GLASS EFFECT) */
        .btn-icon {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-icon:active { 
            transform: scale(0.90); 
            background: rgba(255, 255, 255, 0.2);
        }

        /* BOTÃO PRINCIPAL DE DISPARO (SHUTTER PRO) */
        .btn-shutter {
            background: #ffffff;
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 4px solid rgba(37, 99, 235, 0.9);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 0 22px rgba(37, 99, 235, 0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-shutter:active { 
            transform: scale(0.92); 
            background: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="stage" id="stageArea">
        <video id="webcam" autoplay playsinline muted></video>

        <div class="smoke-left"></div>
        <div class="smoke-right"></div>

        <div id="flashEffect"></div>
        <div id="countdownOverlay"><span id="countdownNumber">3</span></div>
        
        <div id="toastMsg">
            <span>🔥 Foto pronta para os Stories!</span>
            <button class="btn-share-native" id="shareBtn">📤 Compartilhar Agora</button>
        </div>

        <div class="overlay">
            <div class="badge-card">
                <span id="badgeText" class="badge-text">[ ATLETA CONFIRMADO ]</span>
            </div>
            
            <div class="logo-box">
                <img id="logoImg" class="logo-3d" src="ct_tita_logo.png" onerror="tryLoadLogo(this)" alt="CT TITÃ">
                <span id="logoFallback" class="logo-text-fallback" style="display:none;">CT TITÃ</span>
            </div>
        </div>

        <canvas id="photoCanvas" style="display: none;"></canvas>

        <!-- DOCK DE CONTROLES PROFISSIONAL E MINIMALISTA -->
        <div class="controls-bar">
            <button class="btn-icon" onclick="nextBadge()" title="Trocar Frase">🔄</button>
            <button class="btn-icon" onclick="startCountdown()" title="Timer 3 Segundos">⏱️</button>
            <button class="btn-shutter" onclick="takePhoto()" title="Tirar Foto">📸</button>
            <button class="btn-icon" onclick="switchCam()" title="Inverter Câmera">📷</button>
        </div>
    </div>

    <script>
        const badgeTexts = [
            '[ ATLETA CONFIRMADO ]',
            '[ SOBREVIVI AO WOD ]',
            '[ RUMO AO PÓDIO ]',
            '[ MODO TITÃ ]'
        ];

        let currentBadgeIndex = 0;
        let currentFacingMode = 'user';
        let currentStream = null;
        let lastGeneratedBlob = null;

        const video = document.getElementById('webcam');
        const badgeText = document.getElementById('badgeText');
        const logoImg = document.getElementById('logoImg');
        const flashEffect = document.getElementById('flashEffect');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownNumber = document.getElementById('countdownNumber');
        const toastMsg = document.getElementById('toastMsg');
        const shareBtn = document.getElementById('shareBtn');

        function tryLoadLogo(img) {
            const paths = ['ativos/texturas/ct_tita_logo.png', 'ativos/ texturas/ct_tita_logo.png', 'assets/textures/ct_tita_logo.png'];
            let idx = parseInt(img.dataset.idx || '0');
            if (idx < paths.length) {
                img.dataset.idx = idx + 1;
                img.src = paths[idx];
            } else {
                img.style.display = 'none';
                document.getElementById('logoFallback').style.display = 'block';
            }
        }

        async function startCamera(facing) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facing },
                    audio: false
                });
                video.srcObject = currentStream;
                await video.play();
            } catch (err) {
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = currentStream;
                    await video.play();
                } catch (e) {
                    alert("Permita o acesso à câmera no seu navegador!");
                }
            }
        }

        function switchCam() {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            startCamera(currentFacingMode);
        }

        function nextBadge() {
            currentBadgeIndex = (currentBadgeIndex + 1) % badgeTexts.length;
            badgeText.style.opacity = '0';
            setTimeout(() => {
                badgeText.innerText = badgeTexts[currentBadgeIndex];
                badgeText.style.opacity = '1';
            }, 120);
        }

        function startCountdown() {
            countdownOverlay.style.display = 'flex';
            let count = 3;
            countdownNumber.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNumber.innerText = count;
                } else {
                    clearInterval(timer);
                    countdownOverlay.style.display = 'none';
                    takePhoto();
                }
            }, 1000);
        }

        function triggerFlashAndToast() {
            flashEffect.style.opacity = '1';
            setTimeout(() => { flashEffect.style.opacity = '0'; }, 150);

            toastMsg.classList.add('show');
            setTimeout(() => { toastMsg.classList.remove('show'); }, 6000);
        }

        shareBtn.addEventListener('click', async () => {
            if (!lastGeneratedBlob) return;

            const file = new File([lastGeneratedBlob], `ct-tita-wod-${Date.now()}.png`, { type: 'image/png' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: 'Jogos CT Titã',
                        text: 'Meu WOD pago nos Jogos Internos do CT Titã! 🔥',
                        files: [file]
                    });
                } catch (err) {
                    console.log('Partilha cancelada', err);
                }
            } else {
                alert('O seu navegador não suporta partilha direta de arquivos.');
            }
        });

        function takePhoto() {
            triggerFlashAndToast();

            const canvas = document.getElementById('photoCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth || 1080;
            canvas.height = video.videoHeight || 1920;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const gradLeft = ctx.createRadialGradient(0, canvas.height / 2, 50, 0, canvas.height / 2, canvas.width * 0.5);
            gradLeft.addColorStop(0, 'rgba(220, 38, 38, 0.55)');
            gradLeft.addColorStop(1, 'transparent');
            ctx.fillStyle = gradLeft;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const gradRight = ctx.createRadialGradient(canvas.width, canvas.height / 2, 50, canvas.width, canvas.height / 2, canvas.width * 0.5);
            gradRight.addColorStop(0, 'rgba(37, 99, 235, 0.55)');
            gradRight.addColorStop(1, 'transparent');
            ctx.fillStyle = gradRight;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const badgeY = Math.round(canvas.height * 0.06);
            const badgeH = Math.round(canvas.height * 0.055);
            ctx.fillStyle = 'rgba(8, 8, 14, 0.88)';
            if (ctx.roundRect) {
                ctx.roundRect(canvas.width * 0.05, badgeY, canvas.width * 0.9, badgeH, 20);
            } else {
                ctx.fillRect(canvas.width * 0.05, badgeY, canvas.width * 0.9, badgeH);
            }
            ctx.fill();

            const borderGrad = ctx.createLinearGradient(canvas.width * 0.05, 0, canvas.width * 0.95, 0);
            borderGrad.addColorStop(0, '#dc2626');
            borderGrad.addColorStop(1, '#2563eb');
            ctx.lineWidth = 4;
            ctx.strokeStyle = borderGrad;
            ctx.stroke();

            const textGrad = ctx.createLinearGradient(canvas.width * 0.1, 0, canvas.width * 0.9, 0);
            textGrad.addColorStop(0, '#ff4d4d');
            textGrad.addColorStop(0.5, '#ffffff');
            textGrad.addColorStop(1, '#3b82f6');

            const fontSize = Math.round(canvas.width * 0.055);
            ctx.font = `700 ${fontSize}px "Teko", sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillStyle = textGrad;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
            ctx.shadowBlur = 12;
            ctx.fillText(badgeTexts[currentBadgeIndex], canvas.width / 2, badgeY + (badgeH * 0.7));

            if (logoImg.complete && logoImg.naturalWidth !== 0) {
                const logoWidth = Math.round(canvas.width * 0.75);
                const logoHeight = (logoImg.naturalHeight / logoImg.naturalWidth) * logoWidth;
                const logoY = canvas.height - logoHeight - Math.round(canvas.height * 0.05);

                ctx.shadowColor = 'rgba(239, 68, 68, 0.95)';
                ctx.shadowBlur = 40;
                ctx.shadowOffsetY = 6;
                ctx.drawImage(logoImg, (canvas.width - logoWidth) / 2, logoY, logoWidth, logoHeight);
            } else {
                const logoFontSize = Math.round(canvas.width * 0.095);
                ctx.font = `700 ${logoFontSize}px "Teko", sans-serif`;
                ctx.fillStyle = textGrad;
                ctx.shadowColor = 'rgba(239, 68, 68, 0.95)';
                ctx.shadowBlur = 30;
                ctx.fillText('CT TITÃ', canvas.width / 2, canvas.height - Math.round(canvas.height * 0.06));
            }

            ctx.shadowColor = 'transparent';

            canvas.toBlob((blob) => {
                lastGeneratedBlob = blob;
            }, 'image/png');
        }

        window.addEventListener('load', () => startCamera(currentFacingMode));
    </script>
</body>
</html>
