<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jogos CT Titã - Filtro Oficial</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        .camera-container {
            position: relative;
            width: 100vw;
            max-width: 405px;
            height: 100vh;
            max-height: 720px;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ANIMAÇÃO DE FUMAÇA DINÂMICA VIA CSS (VERMELHO E AZUL) */
        .smoke-animated-left {
            position: absolute;
            top: 0; left: -20%;
            width: 70%; height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(220, 38, 38, 0.55), rgba(185, 28, 28, 0.25) 50%, transparent 80%);
            filter: blur(25px);
            pointer-events: none;
            z-index: 2;
            animation: pulseSmokeLeft 4s ease-in-out infinite alternate;
        }

        .smoke-animated-right {
            position: absolute;
            top: 0; right: -20%;
            width: 70%; height: 100%;
            background: radial-gradient(circle at 80% 50%, rgba(37, 99, 235, 0.55), rgba(29, 78, 216, 0.25) 50%, transparent 80%);
            filter: blur(25px);
            pointer-events: none;
            z-index: 2;
            animation: pulseSmokeRight 4s ease-in-out infinite alternate;
        }

        @keyframes pulseSmokeLeft {
            0% { transform: scale(1) translateY(0px); opacity: 0.7; }
            50% { transform: scale(1.15) translateY(-15px); opacity: 0.9; }
            100% { transform: scale(1.05) translateY(10px); opacity: 0.75; }
        }

        @keyframes pulseSmokeRight {
            0% { transform: scale(1.05) translateY(0px); opacity: 0.75; }
            50% { transform: scale(1.2) translateY(15px); opacity: 0.95; }
            100% { transform: scale(1) translateY(-10px); opacity: 0.7; }
        }

        /* CAMADA DOS ELEMENTOS VISUAIS */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 95px;
        }

        /* BADGE CENTRALIZADO NO RODAPÉ */
        .badge-footer {
            position: relative;
            width: 82%;
            max-width: 310px;
            margin-bottom: 15px;
            z-index: 4;
            transition: transform 0.2s ease, opacity 0.2s ease;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.9));
        }

        /* LOGO CT TITÃ MAIOR E EM 3D NO FINAL DA TELA */
        .logo-footer-3d {
            position: relative;
            width: 78%;
            max-width: 290px;
            z-index: 4;
            /* Triplo Efeito de Sombra para destacar 3D */
            filter: drop-shadow(0px 12px 18px rgba(0, 0, 0, 0.95))
                    drop-shadow(-3px -3px 6px rgba(220, 38, 38, 0.6))
                    drop-shadow(3px 3px 6px rgba(37, 99, 235, 0.6));
            transform: perspective(500px) rotateX(10deg);
        }

        /* PAINEL DE CONTROLES NO RODAPÉ */
        .controls {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            z-index: 10;
        }

        .btn {
            background: rgba(220, 38, 38, 0.9);
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .btn-capture {
            background: #2563eb;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 3px solid #fff;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.8);
        }

        .btn-video {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <div class="camera-container" id="captureArea">
        <video id="webcam" autoplay playsinline muted></video>

        <!-- Fumaça Vermelha e Azul Animada por Código -->
        <div class="smoke-animated-left"></div>
        <div class="smoke-animated-right"></div>

        <div class="overlay">
            <!-- Badge Frase -->
            <img id="badgeImg" src="assets/textures/badge_atleta.png" onerror="this.src='ativos/texturas/badge_atleta.png'" class="badge-footer" alt="Badge">
            
            <!-- Logo CT Titã em 3D no final da tela -->
            <img src="assets/textures/ct_tita_logo.png" onerror="this.src='ativos/texturas/ct_tita_logo.png'" class="logo-footer-3d" alt="CT Titã">
        </div>

        <canvas id="photoCanvas" style="display: none;"></canvas>
    </div>

    <div class="controls">
        <button class="btn" onclick="nextBadge()">🔄 Trocar Frase</button>
        <button class="btn btn-capture" onclick="takePhoto()" title="Tirar Foto">📸</button>
        <button class="btn btn-video" id="recBtn" onclick="toggleRecord()" title="Gravar Boomerang">🎥 Boomerang</button>
    </div>

    <script src="scripts/app.js" onerror="this.src='roteiros/app.js'"></script>
</body>
</html>
