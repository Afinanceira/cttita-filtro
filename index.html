<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jogos CT Titã - Filtro Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { 
            width: 100%; height: 100%; height: 100dvh;
            background: #000; color: #fff; 
            font-family: 'Teko', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; 
        }

        .stage {
            position: relative;
            width: 100vw; height: 100vh; height: 100dvh;
            max-width: 430px; max-height: 900px;
            background: #000; overflow: hidden;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
        }

        video, canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* TELA DE MÁSCARA INICIAL (BOTAO MENOR E ELEGANTE) */
        #maskScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a2e 0%, #0a0a0f 100%);
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            transition: opacity 0.4s ease;
        }

        .mask-logo-preview {
            width: 110px;
            height: auto;
            margin-bottom: 18px;
            filter: drop-shadow(0 0 16px rgba(255,255,255,0.25));
        }

        .mask-title {
            font-size: 34px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .mask-desc {
            font-family: sans-serif;
            font-size: 13px;
            color: #94a3b8;
            max-width: 270px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn-load-filter {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #2563eb 100%);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-load-filter:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(220, 38, 38, 0.2);
        }

        /* FUMAÇA ANIMADA NAS LATERAIS */
        .smoke-left {
            position: absolute; top: 0; left: -25%;
            width: 65%; height: 100%;
            background: radial-gradient(circle at 10% 50%, rgba(220, 38, 38, 0.65), transparent 75%);
            filter: blur(25px); pointer-events: none; z-index: 2;
            animation: pulseL 3.5s ease-in-out infinite alternate;
        }

        .smoke-right {
            position: absolute; top: 0; right: -25%;
            width: 65%; height: 100%;
            background: radial-gradient(circle at 90% 50%, rgba(37, 99, 235, 0.65), transparent 75%);
            filter: blur(25px); pointer-events: none; z-index: 2;
            animation: pulseR 3.5s ease-in-out infinite alternate;
        }

        @keyframes pulseL { 0% { opacity: 0.5; } 100% { opacity: 0.9; } }
        @keyframes pulseR { 0% { opacity: 0.9; } 100% { opacity: 0.5; } }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            padding: max(45px, env(safe-area-inset-top) + 15px) 15px max(95px, env(safe-area-inset-bottom)) 15px;
        }

        .badge-card {
            text-align: center; display: flex;
            flex-direction: column; align-items: center;
            justify-content: center; margin-top: 10px;
        }

        .badge-title {
            font-size: clamp(40px, 9.5vw, 54px);
            font-weight: 700; line-height: 0.9;
            letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(90deg, #ff4d4d 0%, #ffffff 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 14px rgba(0, 0, 0, 0.95));
        }

        .badge-subtitle {
            font-size: clamp(16px, 4.2vw, 21px);
            font-weight: 700; letter-spacing: 4px;
            color: #cbd5e1; text-transform: uppercase;
            margin-top: 6px;
            filter: drop-shadow(0px 2px 10px rgba(0, 0, 0, 0.95));
        }

        .logo-box {
            width: 88%; max-width: 330px;
            display: flex; justify-content: center;
            align-items: center; margin-bottom: 15px;
        }

        .logo-3d {
            width: 100%; max-width: 210px; height: auto;
            filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.9));
        }

        .logo-text-fallback {
            background: linear-gradient(90deg, #ef4444 20%, #ffffff 50%, #3b82f6 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 40px; font-weight: 700; letter-spacing: 5px;
        }

        #flashEffect {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 25; opacity: 0; pointer-events: none;
            transition: opacity 0.15s ease-out;
        }

        #toastMsg {
            position: absolute; top: 75px; left: 50%;
            transform: translateX(-50%) translateY(-25px);
            background: rgba(15, 15, 25, 0.95); color: #fff;
            padding: 14px 22px; border-radius: 20px;
            font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.85); z-index: 30; opacity: 0;
            transition: all 0.3s ease; pointer-events: auto;
            display: flex; flex-direction: column; align-items: center;
            gap: 10px; border: 1px solid rgba(255,255,255,0.25); text-align: center;
        }

        #toastMsg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .btn-share-native {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff; border: none; padding: 8px 18px;
            border-radius: 15px; font-weight: bold; font-size: 12px;
            cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.6);
            display: flex; align-items: center; gap: 6px;
        }

        .controls-bar {
            position: absolute; bottom: max(20px, env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%); width: 75%; max-width: 310px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 15px; background: rgba(12, 12, 18, 0.75);
            backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
            z-index: 10; pointer-events: auto;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff; width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-icon svg { width: 20px; height: 20px; fill: #ffffff; transition: transform 0.3s ease; }
        .btn-icon:active { transform: scale(0.90); background: rgba(255, 255, 255, 0.22); }
        .btn-icon:active svg { transform: rotate(180deg); }

        .btn-shutter {
            background: #ffffff; width: 62px; height: 62px; border-radius: 50%;
            border: 4px solid rgba(37, 99, 235, 0.95); display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 0 24px rgba(37, 99, 235, 0.6); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-shutter svg { width: 26px; height: 26px; fill: #1d4ed8; }
        .btn-shutter:active { transform: scale(0.92); background: #e2e8f0; }
    </style>
</head>
<body>

    <!-- TELA DE MÁSCARA INICIAL -->
    <div id="maskScreen">
        <img src="ct_tita_logo.png" class="mask-logo-preview" alt="Logo CT Titã">
        <h1 class="mask-title">Jogos Internos CT Titã</h1>
        <p class="mask-desc">Toque no botão abaixo para carregar o seu filtro oficial.</p>
        <button class="btn-load-filter" onclick="initializeExperience()">
            <span>⚡</span> Carregar Filtro
        </button>
    </div>

    <div class="stage" id="stageArea">
        <video id="webcam" autoplay playsinline muted></video>

        <div class="smoke-left"></div>
        <div class="smoke-right"></div>

        <div id="flashEffect"></div>
        
        <div id="toastMsg">
            <span>🔥 Foto capturada com sucesso!</span>
            <button class="btn-share-native" id="shareBtn">📤 Compartilhar nos Stories</button>
        </div>

        <div class="overlay">
            <div class="badge-card">
                <span id="badgeTitle" class="badge-title">ATLETA CONFIRMADO</span>
                <span id="badgeSubtitle" class="badge-subtitle">JOGOS INTERNOS 2026</span>
            </div>
            
            <div class="logo-box">
                <img id="logoImg" class="logo-3d" src="ct_tita_logo.png" onerror="tryLoadLogo(this)" alt="CT TITÃ">
                <span id="logoFallback" class="logo-text-fallback" style="display:none;">CT TITÃ</span>
            </div>
        </div>

        <canvas id="photoCanvas" style="display: none;"></canvas>

        <div class="controls-bar">
            <button class="btn-icon" onclick="nextBadge()" title="Trocar Frase">
                <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
            </button>

            <button class="btn-shutter" onclick="takePhoto()" title="Tirar Foto">
                <svg viewBox="0 0 24 24"><path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm10-3h-3.17L17 4H7L5.17 6H2v14h20V6zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            </button>

            <button class="btn-icon" onclick="switchCam()" title="Inverter Câmera">
                <svg viewBox="0 0 24 24"><path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            </button>
        </div>
    </div>

    <script>
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) { window.location.reload(); }
        });

        const badgeList = [
            { title: "ATLETA CONFIRMADO", subtitle: "JOGOS INTERNOS 2026" },
            { title: "SOBREVIVI AO WOD", subtitle: "JOGOS INTERNOS 2026" },
            { title: "RUMO AO PÓDIO", subtitle: "JOGOS INTERNOS 2026" },
            { title: "MODO TITÃ", subtitle: "JOGOS INTERNOS 2026" }
        ];

        let currentBadgeIndex = 0;
        let currentFacingMode = 'user';
        let currentStream = null;
        let lastGeneratedBlob = null;

        const video = document.getElementById('webcam');
        const badgeTitleElem = document.getElementById('badgeTitle');
        const badgeSubtitleElem = document.getElementById('badgeSubtitle');
        const logoImg = document.getElementById('logoImg');
        const flashEffect = document.getElementById('flashEffect');
        const toastMsg = document.getElementById('toastMsg');
        const shareBtn = document.getElementById('shareBtn');
        const maskScreen = document.getElementById('maskScreen');

        function tryLoadLogo(img) {
            const paths = ['ct_tita_logo.png', './ct_tita_logo.png', 'ativos/texturas/ct_tita_logo.png', 'assets/textures/ct_tita_logo.png'];
            let idx = parseInt(img.dataset.idx || '0');
            if (idx < paths.length) {
                img.dataset.idx = idx + 1;
                img.src = paths[idx];
            } else {
                img.style.display = 'none';
                document.getElementById('logoFallback').style.display = 'block';
            }
        }

        // AÇÃO DO BOTÃO: Carrega a logo e inicia a câmara com o filtro pronto
        function initializeExperience() {
            maskScreen.style.opacity = '0';
            setTimeout(() => { maskScreen.style.display = 'none'; }, 400);
            startCamera(currentFacingMode);
        }

        async function startCamera(facing) {
            if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facing }, audio: false
                });
                video.srcObject = currentStream;
                await video.play();
            } catch (err) {
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = currentStream;
                    await video.play();
                } catch (e) { alert("Permita o acesso à câmera no seu navegador!"); }
            }
        }

        function switchCam() {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            startCamera(currentFacingMode);
        }

        function nextBadge() {
            currentBadgeIndex = (currentBadgeIndex + 1) % badgeList.length;
            const current = badgeList[currentBadgeIndex];
            badgeTitleElem.style.opacity = '0'; badgeSubtitleElem.style.opacity = '0';
            setTimeout(() => {
                badgeTitleElem.innerText = current.title;
                badgeSubtitleElem.innerText = current.subtitle;
                badgeTitleElem.style.opacity = '1'; badgeSubtitleElem.style.opacity = '1';
            }, 120);
        }

        function triggerFlashAndToast() {
            flashEffect.style.opacity = '1';
            setTimeout(() => { flashEffect.style.opacity = '0'; }, 150);
            video.pause(); toastMsg.classList.add('show');
        }

        shareBtn.addEventListener('click', async () => {
            if (!lastGeneratedBlob) return;
            const file = new File([lastGeneratedBlob], `ct-tita-wod-${Date.now()}.png`, { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: 'Jogos CT Titã',
                        text: 'Meu WOD pago nos Jogos Internos do CT Titã! 🔥',
                        files: [file]
                    });
                } catch (err) { console.log('Partilha cancelada', err); }
            } else { alert('O seu navegador não suporta partilha direta de arquivos.'); }
            toastMsg.classList.remove('show'); video.play();
        });

        function takePhoto() {
            triggerFlashAndToast();
            const canvas = document.getElementById('photoCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1080; canvas.height = 1920;

            const vRatio = video.videoWidth / video.videoHeight;
            const cRatio = canvas.width / canvas.height;
            let sWidth = video.videoWidth, sHeight = video.videoHeight, sx = 0, sy = 0;

            if (vRatio > cRatio) {
                sWidth = video.videoHeight * cRatio; sx = (video.videoWidth - sWidth) / 2;
            } else {
                sHeight = video.videoWidth / cRatio; sy = (video.videoHeight - sHeight) / 2;
            }

            ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

            const gradLeft = ctx.createRadialGradient(0, canvas.height / 2, 50, 0, canvas.height / 2, canvas.width * 0.5);
            gradLeft.addColorStop(0, 'rgba(220, 38, 38, 0.55)'); gradLeft.addColorStop(1, 'transparent');
            ctx.fillStyle = gradLeft; ctx.fillRect(0, 0, canvas.width, canvas.height);

            const gradRight = ctx.createRadialGradient(canvas.width, canvas.height / 2, 50, canvas.width, canvas.height / 2, canvas.width * 0.5);
            gradRight.addColorStop(0, 'rgba(37, 99, 235, 0.55)'); gradRight.addColorStop(1, 'transparent');
            ctx.fillStyle = gradRight; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            const current = badgeList[currentBadgeIndex];
            const titleFontSize = 90;
            ctx.font = `700 ${titleFontSize}px "Teko", sans-serif`;
            ctx.textAlign = 'center';
            
            const textGrad = ctx.createLinearGradient(140, 0, 940, 0);
            textGrad.addColorStop(0, '#ff4d4d'); textGrad.addColorStop(0.5, '#ffffff'); textGrad.addColorStop(1, '#3b82f6');

            ctx.fillStyle = textGrad;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.95)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 5;
            ctx.fillText(current.title, canvas.width / 2, 210);

            const subFontSize = 38;
            ctx.font = `700 ${subFontSize}px "Teko", sans-serif`;
            ctx.fillStyle = '#cbd5e1'; ctx.shadowBlur = 12;
            ctx.fillText(current.subtitle, canvas.width / 2, 260);
            ctx.restore();

            if (logoImg && logoImg.complete && logoImg.naturalWidth !== 0) {
                const logoWidth = Math.round(canvas.width * 0.52);
                const logoHeight = (logoImg.naturalHeight / logoImg.naturalWidth) * logoWidth;
                const logoY = canvas.height - logoHeight - Math.round(canvas.height * 0.06);
                ctx.shadowColor = 'transparent';
                ctx.drawImage(logoImg, (canvas.width - logoWidth) / 2, logoY, logoWidth, logoHeight);
            }

            ctx.shadowColor = 'transparent';
            canvas.toBlob((blob) => { lastGeneratedBlob = blob; }, 'image/png', 1.0);
        }
    </script>
</body>
</html>
