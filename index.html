<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jogos CT Titã - Filtro Oficial</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        .camera-container {
            position: relative;
            width: 100vw;
            max-width: 405px;
            height: 100vh;
            max-height: 720px;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 90px;
        }

        /* Moldura de Fumaça em toda a borda */
        .smoke-frame {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            mix-blend-mode: screen;
            opacity: 0.9;
            z-index: 1;
        }

        /* Frase / Badge centralizado no rodapé */
        .badge-footer {
            position: relative;
            width: 85%;
            max-width: 320px;
            margin-bottom: 12px;
            z-index: 3;
            transition: opacity 0.2s ease;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.8));
        }

        /* Logo do CT Titã em 3D, exaltada e no final da tela */
        .logo-footer {
            position: relative;
            width: 70%;
            max-width: 260px;
            z-index: 3;
            /* Efeito 3D com sombra intensa e profundidade */
            filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.9)) 
                    drop-shadow(0px 4px 6px rgba(220, 38, 38, 0.5));
            transform: scale(1.05);
        }

        .controls {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .btn {
            background: rgba(220, 38, 38, 0.9);
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .btn-capture {
            background: #2563eb;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.8);
        }
    </style>
</head>
<body>

    <div class="camera-container" id="captureArea">
        <video id="webcam" autoplay playsinline muted></video>

        <!-- Moldura de Fumaça por toda a tela -->
        <img src="assets/textures/smoke_frame.png" onerror="this.src='ativos/texturas/smoke_frame.png'" class="smoke-frame" alt="Fumaça">

        <div class="overlay">
            <!-- Badge / Frase -->
            <img id="badgeImg" src="assets/textures/badge_atleta.png" onerror="this.src='ativos/texturas/badge_atleta.png'" class="badge-footer" alt="Badge">
            
            <!-- Logo Grande, 3D e no Final da Tela -->
            <img src="assets/textures/ct_tita_logo.png" onerror="this.src='ativos/texturas/ct_tita_logo.png'" class="logo-footer" alt="CT Titã">
        </div>

        <canvas id="photoCanvas" style="display: none;"></canvas>
    </div>

    <div class="controls">
        <button class="btn" onclick="nextBadge()">🔄 Mudar Badge</button>
        <button class="btn btn-capture" onclick="takePhoto()">📸</button>
    </div>

    <script src="scripts/app.js" onerror="this.src='roteiros/app.js'"></script>
</body>
</html>
