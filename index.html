<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogos CT Titã - Filtro Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { 
            width: 100%; height: 100%; 
            background: #000; color: #fff; 
            font-family: 'Teko', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; 
        }

        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 860px;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        video, canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* FUMAÇA ANIMADA NAS LATERAIS */
        .smoke-left {
            position: absolute;
            top: 0; left: -25%;
            width: 65%; height: 100%;
            background: radial-gradient(circle at 10% 50%, rgba(220, 38, 38, 0.65), transparent 75%);
            filter: blur(25px);
            pointer-events: none;
            z-index: 2;
            animation: pulseL 3.5s ease-in-out infinite alternate;
        }

        .smoke-right {
            position: absolute;
            top: 0; right: -25%;
            width: 65%; height: 100%;
            background: radial-gradient(circle at 90% 50%, rgba(37, 99, 235, 0.65), transparent 75%);
            filter: blur(25px);
            pointer-events: none;
            z-index: 2;
            animation: pulseR 3.5s ease-in-out infinite alternate;
        }

        @keyframes pulseL { 0% { opacity: 0.5; } 100% { opacity: 0.9; } }
        @keyframes pulseR { 0% { opacity: 0.9; } 100% { opacity: 0.5; } }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 35px 15px 95px 15px;
        }

        /* FRASE NO TOPO */
        .badge-card {
            width: 92%;
            max-width: 380px;
            background: rgba(8, 8, 14, 0.85);
            border: 2px solid;
            border-image: linear-gradient(90deg, #dc2626, #2563eb) 1;
            padding: 4px 10px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .badge-text {
            font-size: clamp(20px, 5.2vw, 30px);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff4d4d 0%, #ffffff 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        /* LOGO CT TITÃ SUPER ACESA E COM MÁXIMO DESTAQUE 3D NO RODAPÉ */
        .logo-box {
            width: 88%;
            max-width: 330px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-3d {
            width: 100%;
            max-width: 300px;
            height: auto;
            /* Tripla camada de luzes neon e contraste para acender a logo */
            filter: saturate(1.35) contrast(1.2)
                    drop-shadow(0px 10px 22px rgba(0, 0, 0, 0.98))
                    drop-shadow(-5px 0px 18px rgba(239, 68, 68, 1))
                    drop-shadow(5px 0px 18px rgba(59, 130, 246, 1));
            transform: perspective(600px) rotateX(4deg);
            animation: logo3dPulse 2.8s ease-in-out infinite alternate;
        }

        @keyframes logo3dPulse {
            0% { 
                transform: perspective(600px) rotateX(4deg) scale(1);
                filter: saturate(1.35) contrast(1.2)
                        drop-shadow(0px 10px 22px rgba(0, 0, 0, 0.98))
                        drop-shadow(-5px 0px 18px rgba(239, 68, 68, 1))
                        drop-shadow(5px 0px 18px rgba(59, 130, 246, 1));
            }
            100% { 
                transform: perspective(600px) rotateX(4deg) scale(1.05);
                filter: saturate(1.5) contrast(1.25)
                        drop-shadow(0px 12px 25px rgba(0, 0, 0, 1))
                        drop-shadow(-7px 0px 25px rgba(239, 68, 68, 1))
                        drop-shadow(7px 0px 25px rgba(59, 130, 246, 1));
            }
        }

        .logo-text-fallback {
            background: linear-gradient(90deg, #ef4444 20%, #ffffff 50%, #3b82f6 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 5px;
            text-shadow: 0 0 25px rgba(239, 68, 68, 0.9), 0 0 25px rgba(59, 130, 246, 0.9);
        }

        /* CONTROLES */
        .controls-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 18px;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 40px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.85);
            z-index: 10;
            pointer-events: auto;
        }

        .btn-ctrl {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; gap: 4px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
        }

        .btn-shutter {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            width: 58px; height: 58px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer;
            box-shadow: 0 0 18px rgba(37, 99, 235, 0.8);
        }

        .btn-flip {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer;
        }

        .btn-ctrl:active, .btn-flip:active, .btn-shutter:active { transform: scale(0.93); }
    </style>
</head>
<body>

        <video id="webcam" autoplay playsinline muted></video>

        <div class="smoke-left"></div>
        <div class="smoke-right"></div>

        <div class="overlay">
