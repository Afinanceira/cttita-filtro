<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jogos CT Titã - Filtro Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Teko', 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }
        
        .camera-container {
            position: relative;
            width: 100vw;
            max-width: 430px;
            height: 100vh;
            max-height: 800px;
            background: #050505;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* ANIMAÇÃO DE FUMAÇA AZUL E VERMELHA NAS LATERAIS */
        .smoke-left {
            position: absolute;
            top: 0; left: -30%;
            width: 70%; height: 100%;
            background: radial-gradient(circle at 10% 50%, rgba(220, 38, 38, 0.65), transparent 70%);
            filter: blur(30px);
            pointer-events: none;
            z-index: 2;
            animation: pulseLeft 3.5s ease-in-out infinite alternate;
        }

        .smoke-right {
            position: absolute;
            top: 0; right: -30%;
            width: 70%; height: 100%;
            background: radial-gradient(circle at 90% 50%, rgba(37, 99, 235, 0.65), transparent 70%);
            filter: blur(30px);
            pointer-events: none;
            z-index: 2;
            animation: pulseRight 3.5s ease-in-out infinite alternate;
        }

        @keyframes pulseLeft {
            0% { opacity: 0.55; transform: scale(1); }
            100% { opacity: 0.9; transform: scale(1.1); }
        }
        @keyframes pulseRight {
            0% { opacity: 0.55; transform: scale(1.1); }
            100% { opacity: 0.9; transform: scale(1); }
        }

        /* OVERLAY DOS ELEMENTOS VISUAIS */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 110px;
        }

        /* BADGE / FRASE EM AZUL E VERMELHO GRADIENTE */
        .badge-box {
            position: relative;
            width: 90%;
            max-width: 350px;
            margin-bottom: 12px;
            background: rgba(10, 10, 15, 0.75);
            border: 2px solid;
            border-image: linear-gradient(90deg, #dc2626, #2563eb) 1;
            border-radius: 12px;
            padding: 8px 16px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9);
            z-index: 4;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .badge-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff4d4d 0%, #ffffff 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.9));
        }

        /* LOGO CT TITÃ NO RODAPÉ */
        .logo-box {
            position: relative;
            width: 85%;
            max-width: 320px;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-3d {
            width: 100%;
            max-width: 270px;
            height: auto;
            filter: drop-shadow(0px 8px 20px rgba(0, 0, 0, 0.95))
                    drop-shadow(-2px 0px 10px rgba(220, 38, 38, 0.75))
                    drop-shadow(2px 0px 10px rgba(37, 99, 235, 0.75));
        }

        .logo-text-fallback {
            background: linear-gradient(90deg, #dc2626 30%, #2563eb 70%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9);
        }

        /* BARRA DE CONTROLES ELEGANTE (GLASSMORPHISM) */
        .controls-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .btn-action {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.9), rgba(185, 28, 28, 0.9));
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 18px;
            border-radius: 25px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
            transition: all 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .btn-flip {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-capture-main {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.7);
            transition: all 0.2s ease;
        }

        .btn-capture-main:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div class="camera-container" id="captureArea">
        <video id="webcam" autoplay playsinline muted></video>

        <!-- Fumaça Vermelha e Azul -->
        <div class="smoke-left"></div>
        <div class="smoke-right"></div>

        <div class="overlay">
            <!-- Badge / Frase Estilizada com Mescla Vermelho e Azul -->
            <div class="badge-box">
                <span id="badgeText" class="badge-text">[ ATLETA CONFIRMADO ]</span>
            </div>
            
            <!-- Logo CT Titã em 3D no final da tela -->
            <div class="logo-box">
                <img id="logoImg" class="logo-3d" src="ct_tita_logo.png" onerror="tryLoadLogo(this)" alt="CT TITÃ">
                <span id="logoFallback" class="logo-text-fallback" style="display:none;">CT TITÃ</span>
            </div>
        </div>

        <canvas id="photoCanvas" style="display: none;"></canvas>
    </div>

    <!-- Barra Flutuante de Ações Profissional -->
    <div class="controls-bar">
        <button class="btn-action" onclick="nextBadge()">
            <span>🔄</span> Frase
        </button>

        <button class="btn-capture-main" onclick="takePhoto()" title="Tirar Foto">
            📸
        </button>

        <button class="btn-flip" onclick="switchCamera()" title="Inverter Câmera">
            📷
        </button>
    </div>

    <script>
        const badgeTexts = [
            '[ ATLETA CONFIRMADO ]',
            '[ SOBREVIVI AO WOD ]',
            '[ RUMO AO PÓDIO ]',
            '[ MODO TITÃ: ACTIVATED ]'
        ];

        let currentBadgeIndex = 0;
        let currentFacingMode = 'user'; // 'user' para frontal, 'environment' para traseira
        let currentStream = null;

        const video = document.getElementById('webcam');
        const badgeText = document.getElementById('badgeText');
        const logoImg = document.getElementById('logoImg');

        function tryLoadLogo(img) {
            const paths = ['ativos/texturas/ct_tita_logo.png', 'ativos/ texturas/ct_tita_logo.png', 'assets/textures/ct_tita_logo.png'];
            let idx = parseInt(img.dataset.idx || '0');
            if (idx < paths.length) {
                img.dataset.idx = idx + 1;
                img.src = paths[idx];
            } else {
                img.style.display = 'none';
                document.getElementById('logoFallback').style.display = 'block';
            }
        }

        // Inicializa a câmera sem zoom forçado
        async function startCamera(facing) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: facing,
                    width: { ideal: 1080 },
                    height: { ideal: 1920 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                await video.play();
            } catch (err) {
                console.warn("Erro ao carregar câmera com restrição:", err);
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = currentStream;
                    await video.play();
                } catch (e) {
                    alert("Permita o acesso à câmera nas configurações do seu navegador!");
                }
            }
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            startCamera(currentFacingMode);
        }

        function nextBadge() {
            currentBadgeIndex = (currentBadgeIndex + 1) % badgeTexts.length;
            badgeText.style.opacity = '0';
            setTimeout(() => {
                badgeText.innerText = badgeTexts[currentBadgeIndex];
                badgeText.style.opacity = '1';
            }, 120);
        }

        // CAPTURA DA FOTO
        function takePhoto() {
            const canvas = document.getElementById('photoCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = 1080;
            canvas.height = 1920;

            // 1. Câmera
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 2. Fumaça Lateral Vermelha e Azul
            const gradLeft = ctx.createRadialGradient(0, 960, 50, 0, 960, 650);
            gradLeft.addColorStop(0, 'rgba(220, 38, 38, 0.55)');
            gradLeft.addColorStop(1, 'transparent');
            ctx.fillStyle = gradLeft;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const gradRight = ctx.createRadialGradient(1080, 960, 50, 1080, 960, 650);
            gradRight.addColorStop(0, 'rgba(37, 99, 235, 0.55)');
            gradRight.addColorStop(1, 'transparent');
            ctx.fillStyle = gradRight;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3. Moldura de Fundo da Frase
            const badgeY = canvas.height - 470;
            ctx.fillStyle = 'rgba(10, 10, 15, 0.85)';
            if (ctx.roundRect) {
                ctx.roundRect(100, badgeY, 880, 100, 20);
            } else {
                ctx.fillRect(100, badgeY, 880, 100);
            }
            ctx.fill();

            // Bordas em Gradiente no Canvas
            const borderGrad = ctx.createLinearGradient(100, 0, 980, 0);
            borderGrad.addColorStop(0, '#dc2626');
            borderGrad.addColorStop(1, '#2563eb');
            ctx.lineWidth = 4;
            ctx.strokeStyle = borderGrad;
            ctx.stroke();

            // Texto em Gradiente Mesclado (Vermelho -> Branco -> Azul)
            const textGrad = ctx.createLinearGradient(150, 0, 930, 0);
            textGrad.addColorStop(0, '#ff4d4d');
            textGrad.addColorStop(0.5, '#ffffff');
            textGrad.addColorStop(1, '#3b82f6');

            ctx.font = '700 58px "Teko", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = textGrad;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
            ctx.shadowBlur = 12;
            ctx.fillText(badgeTexts[currentBadgeIndex], canvas.width / 2, badgeY + 68);

            // 4. Logo do CT Titã
            if (logoImg.complete && logoImg.naturalWidth !== 0) {
                const logoWidth = 760;
                const logoHeight = (logoImg.naturalHeight / logoImg.naturalWidth) * logoWidth;
                const logoY = canvas.height - logoHeight - 80;

                ctx.shadowColor = 'rgba(220, 38, 38, 0.85)';
                ctx.shadowBlur = 30;
                ctx.shadowOffsetY = 6;
                ctx.drawImage(logoImg, (canvas.width - logoWidth) / 2, logoY, logoWidth, logoHeight);
            } else {
                ctx.font = '700 85px "Teko", sans-serif';
                ctx.fillStyle = textGrad;
                ctx.fillText('CT TITÃ', canvas.width / 2, canvas.height - 120);
            }

            ctx.shadowColor = 'transparent';

            // Baixar foto final PNG
            const link = document.createElement('a');
            link.download = `ct-tita-wod-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.addEventListener('load', () => startCamera(currentFacingMode));
    </script>
</body>
</html>
